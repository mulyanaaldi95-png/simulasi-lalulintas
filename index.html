<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Lampu Lalu Lintas 4-Arah - Fixed Physics & Aesthetics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }
        .gta-font { font-family: 'Rajdhani', sans-serif; }
        .neon-panel {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(236, 72, 153, 0.3);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <header class="w-full max-w-7xl flex flex-col md:flex-row justify-between items-center py-3 px-6 neon-panel rounded-2xl mb-4">
        <div class="flex items-center space-x-3">
            <div class="w-4 h-4 bg-pink-500 rounded-full animate-ping"></div>
            <h1 class="gta-font text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400">
                VICE CITY TRAFFIC CONTROL // PRO TRAFFIC
            </h1>
        </div>
        <div class="flex items-center space-x-4 text-sm gta-font font-semibold">
            <button onclick="toggleDayNight()" id="btn-theme" class="px-3 py-1.5 rounded-xl font-bold border transition flex items-center space-x-2 bg-indigo-950 border-indigo-500/40 text-indigo-300">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">NIGHT MODE</span>
            </button>
            <div class="text-cyan-400 bg-cyan-950/60 px-3 py-1 rounded-lg border border-cyan-500/30">
                MODE: <span id="mode-display" class="font-bold">AUTOMATIC</span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-4 gap-6 flex-grow items-center">
        
        <!-- Left Sidebar Controls -->
        <section class="lg:col-span-1 neon-panel p-5 rounded-2xl flex flex-col space-y-4">
            <h2 class="gta-font text-xl font-bold text-pink-500 border-b border-pink-500/30 pb-2">SIGNAL CONFIG</h2>
            
            <div class="flex space-x-2">
                <button onclick="setMode('auto')" id="btn-auto" class="flex-1 py-2 rounded-xl gta-font font-bold text-sm bg-pink-600 text-white shadow-lg">AUTO</button>
                <button onclick="setMode('manual')" id="btn-manual" class="flex-1 py-2 rounded-xl gta-font font-bold text-sm bg-gray-800 text-gray-400">MANUAL</button>
            </div>

            <div id="manual-controls" class="hidden flex flex-col space-y-2 bg-black/40 p-3 rounded-xl border border-pink-500/20">
                <span class="text-xs text-pink-300 font-semibold uppercase">Hijaukan Jalur:</span>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="forceDirection('N')" class="py-1.5 bg-gray-800 hover:bg-emerald-600 text-xs rounded font-bold text-white">UTARA / SELATAN</button>
                    <button onclick="forceDirection('E')" class="py-1.5 bg-gray-800 hover:bg-emerald-600 text-xs rounded font-bold text-white">TIMUR / BARAT</button>
                </div>
            </div>

            <div class="space-y-3 pt-2">
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span>LAMPU HIJAU:</span>
                        <span id="val-green" class="text-cyan-400 font-bold">8s</span>
                    </div>
                    <input type="range" id="slider-green" min="4" max="20" value="8" class="w-full accent-cyan-400" oninput="updateTiming()">
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span>LAMPU KUNING:</span>
                        <span id="val-yellow" class="text-amber-400 font-bold">3s</span>
                    </div>
                    <input type="range" id="slider-yellow" min="2" max="6" value="3" class="w-full accent-amber-400" oninput="updateTiming()">
                </div>
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span>LAMPU MERAH (CLEARANCE):</span>
                        <span id="val-red" class="text-rose-400 font-bold">2s</span>
                    </div>
                    <input type="range" id="slider-red" min="1" max="5" value="2" class="w-full accent-rose-400" oninput="updateTiming()">
                </div>
            </div>

            <div class="pt-2 border-t border-gray-700/50 space-y-3">
                <div>
                    <div class="flex justify-between text-xs font-semibold mb-1">
                        <span>KEPADATAN MOBIL:</span>
                        <span id="val-density" class="text-pink-400 font-bold">Sedang</span>
                    </div>
                    <input type="range" id="slider-density" min="1" max="3" value="2" class="w-full accent-pink-500" oninput="updateDensity()">
                </div>
                <button onclick="togglePause()" id="btn-pause" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-black font-bold gta-font rounded-xl">
                    PAUSE SIMULASI
                </button>
            </div>
        </section>

        <!-- Intersection Area -->
        <section class="lg:col-span-3 relative flex items-center justify-center bg-gray-950 rounded-2xl border-2 border-pink-500/30 overflow-hidden h-[550px]">
            <canvas id="simCanvas" width="800" height="550" class="w-full h-full object-contain"></canvas>

            <div class="absolute top-4 left-4 bg-black/80 border border-cyan-500/40 backdrop-blur px-3 py-2 rounded-xl text-xs gta-font">
                <div class="text-cyan-400 font-bold">UTARA - SELATAN: <span id="ns-status" class="text-white">HIJAU</span></div>
                <div class="text-gray-400">COUNTDOWN: <span id="ns-timer" class="text-emerald-400 font-bold text-sm">8</span>s</div>
            </div>

            <div class="absolute top-4 right-4 bg-black/80 border border-pink-500/40 backdrop-blur px-3 py-2 rounded-xl text-xs gta-font text-right">
                <div class="text-pink-400 font-bold">TIMUR - BARAT: <span id="ew-status" class="text-white">MERAH</span></div>
                <div class="text-gray-400">COUNTDOWN: <span id="ew-timer" class="text-rose-400 font-bold text-sm">13</span>s</div>
            </div>
        </section>

    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let config = {
            greenTime: 8,
            yellowTime: 3,
            redHoldTime: 2,
            density: 2,
            mode: 'auto',
            paused: false,
            forcedDir: 'N',
            isNight: true
        };

        let currentPhase = 0;
        let phaseTimer = config.greenTime;
        let vehicles = [];

        // Definisi Koordinat Jalur Presisi (Mencegah Tabrakan Jalur Berlawanan)
        const LANES = {
            N: { x: 425, y: 600, dx: 0, dy: -1, stopY: 360 }, // Ke Utara (Jalur Kanan)
            S: { x: 375, y: -60, dx: 0, dy: 1, stopY: 190 },  // Ke Selatan (Jalur Kiri)
            E: { x: -60, y: 300, dx: 1, dy: 0, stopX: 310 },  // Ke Timur (Jalur Bawah)
            W: { x: 860, y: 250, dx: -1, dy: 0, stopX: 490 }  // Ke Barat (Jalur Atas)
        };

        class Vehicle {
            constructor(direction) {
                this.direction = direction;
                this.lane = LANES[direction];
                this.width = (direction === 'N' || direction === 'S') ? 22 : 40;
                this.height = (direction === 'N' || direction === 'S') ? 40 : 22;
                this.x = this.lane.x - this.width / 2;
                this.y = this.lane.y - this.height / 2;
                this.speed = 0;
                this.maxSpeed = 2.2 + Math.random() * 0.8;
                this.color = ['#ef4444', '#3b82f6', '#eab308', '#a855f7', '#06b6d4', '#10b981'][Math.floor(Math.random() * 6)];
                this.isStopped = false;
            }

            update() {
                let lightState = getLightStateForDir(this.direction);
                this.isStopped = false;

                // 1. Cek Garis Stop Lampu Merah/Kuning
                if (lightState === 'RED' || lightState === 'YELLOW') {
                    if (this.shouldStopAtLine()) {
                        this.isStopped = true;
                    }
                }

                // 2. Cek Jarak Mobil Di Depan (Perbaikan Jarak Antrean Agar Tidak Menumpuk)
                for (let other of vehicles) {
                    if (other !== this && other.direction === this.direction) {
                        if (this.checkCarAhead(other)) {
                            this.isStopped = true;
                            break;
                        }
                    }
                }

                // Pengaturan Akselerasi / Pengereman
                if (this.isStopped) {
                    this.speed = Math.max(0, this.speed - 0.2);
                } else {
                    this.speed = Math.min(this.maxSpeed, this.speed + 0.08);
                }

                this.x += this.lane.dx * this.speed;
                this.y += this.lane.dy * this.speed;
            }

            shouldStopAtLine() {
                const margin = 10;
                const buffer = 45; // Jarak aman berhenti di belakang garis stop
                if (this.direction === 'N') return this.y > this.lane.stopY && this.y <= this.lane.stopY + buffer;
                if (this.direction === 'S') return this.y + this.height < this.lane.stopY && this.y + this.height >= this.lane.stopY - buffer;
                if (this.direction === 'E') return this.x + this.width < this.lane.stopX && this.x + this.width >= this.lane.stopX - buffer;
                if (this.direction === 'W') return this.x > this.lane.stopX && this.x <= this.lane.stopX + buffer;
                return false;
            }

            checkCarAhead(other) {
                const minGap = 55; // JARAK AMAN ANTAR MOBIL (Diperbesar agar tidak dempet)
                
                if (this.direction === 'N' && other.y < this.y && (this.y - other.y) < minGap) return true;
                if (this.direction === 'S' && other.y > this.y && (other.y - this.y) < minGap) return true;
                if (this.direction === 'E' && other.x > this.x && (other.x - this.x) < minGap) return true;
                if (this.direction === 'W' && other.x < this.x && (this.x - other.x) < minGap) return true;
                return false;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                
                // Rotasi Kendaraan Sesuai Arah Laju
                if (this.direction === 'N') ctx.rotate(0);
                if (this.direction === 'S') ctx.rotate(Math.PI);
                if (this.direction === 'E') ctx.rotate(Math.PI / 2);
                if (this.direction === 'W') ctx.rotate(-Math.PI / 2);

                const w = 22;
                const h = 40;

                // Sorot Lampu Depan (Headlight Beam) Presisi Ke Depan
                if (config.isNight) {
                    let grad = ctx.createRadialGradient(0, -h/2, 2, 0, -h/2 - 40, 30);
                    grad.addColorStop(0, 'rgba(254, 240, 138, 0.4)');
                    grad.addColorStop(1, 'rgba(254, 240, 138, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(-w/2 + 2, -h/2);
                    ctx.lineTo(-w/2 - 12, -h/2 - 45);
                    ctx.lineTo(w/2 + 12, -h/2 - 45);
                    ctx.lineTo(w/2 - 2, -h/2);
                    ctx.closePath();
                    ctx.fill();
                }

                // Bodi Mobil
                ctx.fillStyle = this.color;
                ctx.fillRect(-w/2, -h/2, w, h);
                
                // Kaca Depan & Belakang
                ctx.fillStyle = config.isNight ? '#0f172a' : '#38bdf8';
                ctx.fillRect(-w/2 + 2, -h/2 + 7, w - 4, 8);
                ctx.fillRect(-w/2 + 3, h/2 - 10, w - 6, 5);

                // Lampu Depan
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(-w/2 + 2, -h/2, 4, 2);
                ctx.fillRect(w/2 - 6, -h/2, 4, 2);

                // Lampu Rem / Belakang
                ctx.fillStyle = this.isStopped ? '#ef4444' : '#991b1b';
                if (this.isStopped && config.isNight) {
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 8;
                }
                ctx.fillRect(-w/2 + 2, h/2 - 2, 4, 2);
                ctx.fillRect(w/2 - 6, h/2 - 2, 4, 2);

                ctx.restore();
            }
        }

        function getLightStateForDir(dir) {
            if (currentPhase === 0) return (dir === 'N' || dir === 'S') ? 'GREEN' : 'RED';
            if (currentPhase === 1) return (dir === 'N' || dir === 'S') ? 'YELLOW' : 'RED';
            if (currentPhase === 2) return 'RED';
            if (currentPhase === 3) return (dir === 'E' || dir === 'W') ? 'GREEN' : 'RED';
            if (currentPhase === 4) return (dir === 'E' || dir === 'W') ? 'YELLOW' : 'RED';
            if (currentPhase === 5) return 'RED';
            return 'RED';
        }

        // Timer Loop Engine
        setInterval(() => {
            if (config.paused) return;
            phaseTimer--;

            if (config.mode === 'auto') {
                if (phaseTimer <= 0) {
                    currentPhase = (currentPhase + 1) % 6;
                    setPhaseDuration();
                }
            } else {
                currentPhase = (config.forcedDir === 'N') ? 0 : 3;
            }
            updateUIHUD();
        }, 1000);

        function setPhaseDuration() {
            if (currentPhase === 0 || currentPhase === 3) phaseTimer = config.greenTime;
            else if (currentPhase === 1 || currentPhase === 4) phaseTimer = config.yellowTime;
            else phaseTimer = config.redHoldTime;
        }

        function updateUIHUD() {
            let nsState = getLightStateForDir('N');
            let ewState = getLightStateForDir('E');

            document.getElementById('ns-status').innerText = nsState;
            document.getElementById('ns-status').className = nsState === 'GREEN' ? 'text-emerald-400 font-bold' : nsState === 'YELLOW' ? 'text-amber-400 font-bold' : 'text-rose-500 font-bold';
            document.getElementById('ns-timer').innerText = phaseTimer;

            document.getElementById('ew-status').innerText = ewState;
            document.getElementById('ew-status').className = ewState === 'GREEN' ? 'text-emerald-400 font-bold' : ewState === 'YELLOW' ? 'text-amber-400 font-bold' : 'text-rose-500 font-bold';
            document.getElementById('ew-timer').innerText = phaseTimer;
        }

        // Generator Kendaraan (Spawn Controller)
        setInterval(() => {
            if (config.paused) return;
            let maxVehicles = config.density * 3 + 2;
            if (vehicles.length < maxVehicles) {
                let dirs = ['N', 'S', 'E', 'W'];
                let chosenDir = dirs[Math.floor(Math.random() * dirs.length)];
                
                let canSpawn = true;
                for (let v of vehicles) {
                    if (v.direction === chosenDir) {
                        if (chosenDir === 'N' && v.y > 510) canSpawn = false;
                        if (chosenDir === 'S' && v.y < 40) canSpawn = false;
                        if (chosenDir === 'E' && v.x < 40) canSpawn = false;
                        if (chosenDir === 'W' && v.x > 740) canSpawn = false;
                    }
                }
                if (canSpawn) vehicles.push(new Vehicle(chosenDir));
            }
        }, 1000);

        // Render Loop Utama
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Jalan Raya
            ctx.fillStyle = config.isNight ? '#090d16' : '#64748b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Aspal Utama (Persimpangan)
            ctx.fillStyle = config.isNight ? '#1e293b' : '#475569';
            ctx.fillRect(330, 0, 140, 550); // Jalan Vertikal
            ctx.fillRect(0, 215, 800, 140); // Jalan Horizontal

            // 2. Markah Jalan & Zebra Cross
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);

            // Garis Tengah Putus-Putus
            ctx.beginPath();
            ctx.moveTo(400, 0); ctx.lineTo(400, 215);
            ctx.moveTo(400, 355); ctx.lineTo(400, 550);
            ctx.moveTo(0, 285); ctx.lineTo(330, 285);
            ctx.moveTo(470, 285); ctx.lineTo(800, 285);
            ctx.stroke();
            ctx.setLineDash([]);

            // Garis Stop Merah (Stop Lines)
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(400, 355, 70, 4); // Utara
            ctx.fillRect(330, 215, 70, 4); // Selatan
            ctx.fillRect(330, 285, 4, 70); // Timur
            ctx.fillRect(470, 215, 4, 70); // Barat

            // Zebra Cross
            ctx.fillStyle = '#ffffff';
            for(let i = 0; i < 6; i++) ctx.fillRect(340 + i * 20, 205, 12, 6);
            for(let i = 0; i < 6; i++) ctx.fillRect(340 + i * 20, 355, 12, 6);
            for(let i = 0; i < 6; i++) ctx.fillRect(320, 225 + i * 20, 6, 12);
            for(let i = 0; i < 6; i++) ctx.fillRect(474, 225 + i * 20, 6, 12);

            // 3. Update & Gambar Kendaraan
            for (let i = vehicles.length - 1; i >= 0; i--) {
                vehicles[i].update();
                vehicles[i].draw();

                if (vehicles[i].x < -100 || vehicles[i].x > 900 || vehicles[i].y < -100 || vehicles[i].y > 650) {
                    vehicles.splice(i, 1);
                }
            }

            // 4. Gambar Tiang Lampu Lalu Lintas (Posisi Di Luar Bahu Jalan)
            drawTrafficLightPost(305, 180, getLightStateForDir('S')); // Selatan
            drawTrafficLightPost(495, 375, getLightStateForDir('N')); // Utara
            drawTrafficLightPost(495, 180, getLightStateForDir('W')); // Barat
            drawTrafficLightPost(305, 375, getLightStateForDir('E')); // Timur

            requestAnimationFrame(animate);
        }

        function drawTrafficLightPost(x, y, state) {
            ctx.save();
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 1.5;
            
            ctx.beginPath();
            ctx.roundRect(x - 9, y - 22, 18, 44, 4);
            ctx.fill();
            ctx.stroke();

            let redColor = (state === 'RED') ? '#ef4444' : '#450a0a';
            let yellowColor = (state === 'YELLOW') ? '#eab308' : '#422006';
            let greenColor = (state === 'GREEN') ? '#22c55e' : '#052e16';

            // Red
            ctx.fillStyle = redColor;
            ctx.beginPath(); ctx.arc(x, y - 14, 4.5, 0, Math.PI * 2); ctx.fill();
            if(state === 'RED') { ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0; }

            // Yellow
            ctx.fillStyle = yellowColor;
            ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
            if(state === 'YELLOW') { ctx.shadowColor = '#eab308'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0; }

            // Green
            ctx.fillStyle = greenColor;
            ctx.beginPath(); ctx.arc(x, y + 14, 4.5, 0, Math.PI * 2); ctx.fill();
            if(state === 'GREEN') { ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0; }

            ctx.restore();
        }

        // Control Helpers
        function toggleDayNight() {
            config.isNight = !config.isNight;
            document.getElementById('theme-text').innerText = config.isNight ? "NIGHT MODE" : "DAY MODE";
            document.getElementById('theme-icon').innerText = config.isNight ? "🌙" : "☀️";
        }

        function setMode(m) {
            config.mode = m;
            document.getElementById('mode-display').innerText = m.toUpperCase();
            document.getElementById('manual-controls').classList.toggle('hidden', m === 'auto');
        }

        function forceDirection(dir) {
            config.forcedDir = dir;
            currentPhase = (dir === 'N') ? 0 : 3;
            phaseTimer = 99;
            updateUIHUD();
        }

        function updateTiming() {
            config.greenTime = parseInt(document.getElementById('slider-green').value);
            config.yellowTime = parseInt(document.getElementById('slider-yellow').value);
            config.redHoldTime = parseInt(document.getElementById('slider-red').value);

            document.getElementById('val-green').innerText = config.greenTime + 's';
            document.getElementById('val-yellow').innerText = config.yellowTime + 's';
            document.getElementById('val-red').innerText = config.redHoldTime + 's';
        }

        function updateDensity() {
            config.density = parseInt(document.getElementById('slider-density').value);
            let labels = ['', 'Rendah', 'Sedang', 'Tinggi'];
            document.getElementById('val-density').innerText = labels[config.density];
        }

        function togglePause() {
            config.paused = !config.paused;
            document.getElementById('btn-pause').innerText = config.paused ? "RESUME SIMULASI" : "PAUSE SIMULATION";
        }

        animate();
    </script>
</body>
</html>
